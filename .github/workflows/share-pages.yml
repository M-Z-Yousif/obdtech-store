name: Rebuild product share pages
on:
  push:
    branches: [main]
    paths: [index.html, tools/build-share-pages.js]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-share-pages.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p
          git diff --cached --quiet || (git commit -m "Rebuild product share pages" && git push)
